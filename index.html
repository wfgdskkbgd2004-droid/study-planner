<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>منظم المذاكرة</title>
  <style>
    body { font-family: Arial, sans-serif; direction: rtl; background:#f9f9f9; padding:20px; }
    h2 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background: #eee; }
    input, select, button { padding: 8px; margin: 5px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; border-radius:5px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>📚 منظم المذاكرة</h2>

  <div>
    <input type="text" id="subject" placeholder="المادة">
    <input type="text" id="day" placeholder="اليوم">
    <input type="text" id="topic" placeholder="الموضوع">
    <input type="text" id="duration" placeholder="المدة">
    <button onclick="addSession()">➕ أضف الجلسة</button>
  </div>

  <table id="studyTable">
    <thead>
      <tr>
        <th>المادة</th>
        <th>اليوم</th>
        <th>الموضوع</th>
        <th>المدة</th>
        <th>إجراء</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // تحميل البيانات من LocalStorage
    let sessions = JSON.parse(localStorage.getItem("sessions")) || [];

    function renderTable() {
      const tbody = document.querySelector("#studyTable tbody");
      tbody.innerHTML = "";
      sessions.forEach((s, index) => {
        let row = `
          <tr>
            <td>${s.subject}</td>
            <td>${s.day}</td>
            <td>${s.topic}</td>
            <td>${s.duration}</td>
            <td><button onclick="deleteSession(${index})">🗑 حذف</button></td>
          </tr>`;
        tbody.innerHTML += row;
      });
    }

    function addSession() {
      let subject = document.getElementById("subject").value.trim();
      let day = document.getElementById("day").value.trim();
      let topic = document.getElementById("topic").value.trim();
      let duration = document.getElementById("duration").value.trim();

      if (subject && day && topic && duration) {
        sessions.push({subject, day, topic, duration});
        localStorage.setItem("sessions", JSON.stringify(sessions));
        renderTable();

        // مسح المدخلات بعد الإضافة
        document.getElementById("subject").value = "";
        document.getElementById("day").value = "";
        document.getElementById("topic").value = "";
        document.getElementById("duration").value = "";
      } else {
        alert("⚠ من فضلك املأ كل الخانات قبل الإضافة");
      }
    }

    function deleteSession(index) {
      sessions.splice(index, 1);
      localStorage.setItem("sessions", JSON.stringify(sessions));
      renderTable();
    }

    // أول ما تفتح الصفحة يعرض الجدول
    renderTable();
  </script>

</body>
</html>
